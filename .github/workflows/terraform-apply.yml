name: Terraform Production Apply

on:
  push:
    branches: [main]
    paths:
      - 'live/prod/workloads/printing-api/**'
      - 'modules/ecs-service/**'
      - 'policies/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_ROOT: live/prod/workloads/printing-api
  AWS_REGION: ap-northeast-1
  TF_VAR_cluster_arn: ${{ vars.PRINTING_API_CLUSTER_ARN_PROD }}
  TF_VAR_subnet_ids: ${{ vars.PRINTING_API_SUBNET_IDS_JSON_PROD }}
  TF_VAR_security_group_ids: ${{ vars.PRINTING_API_SECURITY_GROUP_IDS_JSON_PROD }}
  TF_VAR_target_group_arn: ${{ vars.PRINTING_API_TARGET_GROUP_ARN_PROD }}
  TF_VAR_container_image: ${{ vars.PRINTING_API_IMAGE_PROD }}

concurrency:
  group: terraform-apply-printing-api-production
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Configure AWS credentials for apply
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TERRAFORM_APPLY_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-apply-printing-api-${{ github.run_id }}
          allowed-account-ids: ${{ vars.PROD_PRINTING_ACCOUNT_ID }}

      - name: Terraform init
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET_PROD }}" \
            -backend-config="key=prod/workloads/printing-api/ap-northeast-1/terraform.tfstate" \
            -backend-config="region=${{ vars.TF_STATE_REGION_PROD }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE_PROD }}" \
            -backend-config="use_lockfile=true"

      - name: Create saved production plan
        working-directory: ${{ env.TF_ROOT }}
        run: terraform plan -no-color -out=tfplan

      - name: Render plan JSON
        working-directory: ${{ env.TF_ROOT }}
        run: terraform show -json tfplan > plan.json

      - name: Evaluate organisation policy
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            openpolicyagent/conftest:v0.68.2 \
            test "/workspace/${TF_ROOT}/plan.json" --policy /workspace/policies

      - name: Apply exact saved plan
        working-directory: ${{ env.TF_ROOT }}
        run: terraform apply -auto-approve tfplan

      - name: Write deployment summary
        if: always()
        run: |
          {
            echo "## Production Terraform apply"
            echo "- Root: \`${TF_ROOT}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Actor: \`${GITHUB_ACTOR}\`"
            echo "- Workflow run: \`${GITHUB_RUN_ID}\`"
          } >> "$GITHUB_STEP_SUMMARY"
